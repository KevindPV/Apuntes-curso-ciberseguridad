<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#f5f5f5"/>

  <!-- Zones -->
  <rect x="70" y="80" width="300" height="440" fill="none" stroke="#d87a7a" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="90" y="55" font-size="34" font-family="Arial" fill="#555">Red local</text>

  <rect x="470" y="190" width="290" height="350" fill="none" stroke="#d87a7a" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="570" y="165" font-size="34" font-family="Arial" fill="#555">DMZ</text>

  <!-- LAN devices -->
  <rect x="120" y="130" width="160" height="70" fill="none" stroke="#506070" stroke-width="3"/>
  <text x="182" y="172" font-size="24" font-family="Arial" fill="#444">PC</text>
  <rect x="120" y="240" width="160" height="70" fill="none" stroke="#506070" stroke-width="3"/>
  <text x="160" y="282" font-size="24" font-family="Arial" fill="#444">Printer</text>
  <rect x="120" y="350" width="160" height="70" fill="none" stroke="#506070" stroke-width="3"/>
  <text x="182" y="392" font-size="24" font-family="Arial" fill="#444">PC</text>

  <!-- DMZ services -->
  <rect x="530" y="230" width="170" height="60" fill="none" stroke="#506070" stroke-width="3"/>
  <text x="592" y="268" font-size="24" font-family="Arial" fill="#444">Web</text>
  <rect x="530" y="320" width="170" height="60" fill="none" stroke="#506070" stroke-width="3"/>
  <text x="590" y="358" font-size="24" font-family="Arial" fill="#444">Mail</text>
  <rect x="530" y="410" width="170" height="60" fill="none" stroke="#506070" stroke-width="3"/>
  <text x="598" y="448" font-size="24" font-family="Arial" fill="#444">App</text>

  <!-- Firewalls and router -->
  <rect x="650" y="85" width="110" height="75" fill="none" stroke="#444" stroke-width="4"/>
  <text x="620" y="70" font-size="30" font-family="Arial" fill="#555">Firewall</text>

  <rect x="960" y="280" width="110" height="55" fill="none" stroke="#666" stroke-width="4"/>
  <text x="970" y="260" font-size="30" font-family="Arial" fill="#555">Router</text>

  <rect x="960" y="430" width="110" height="75" fill="none" stroke="#444" stroke-width="4"/>
  <text x="960" y="415" font-size="30" font-family="Arial" fill="#555">Firewall</text>

  <!-- Internet cloud -->
  <ellipse cx="1000" cy="110" rx="35" ry="25" fill="none" stroke="#666" stroke-width="4"/>
  <ellipse cx="1040" cy="95" rx="40" ry="30" fill="none" stroke="#666" stroke-width="4"/>
  <ellipse cx="1080" cy="110" rx="35" ry="25" fill="none" stroke="#666" stroke-width="4"/>
  <line x1="970" y1="130" x2="1110" y2="130" stroke="#666" stroke-width="4"/>
  <text x="980" y="55" font-size="34" font-family="Arial" fill="#555">Internet</text>

  <!-- Connections -->
  <line x1="280" y1="165" x2="650" y2="120" stroke="#666" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="280" y1="275" x2="650" y2="120" stroke="#666" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="280" y1="385" x2="650" y2="120" stroke="#666" stroke-width="3" stroke-dasharray="10 8"/>

  <line x1="760" y1="120" x2="960" y2="470" stroke="#666" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="1020" y1="335" x2="1020" y2="430" stroke="#666" stroke-width="3" stroke-dasharray="10 8"/>

  <line x1="700" y1="260" x2="960" y2="470" stroke="#666" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="700" y1="350" x2="960" y2="470" stroke="#666" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="700" y1="440" x2="960" y2="470" stroke="#666" stroke-width="3" stroke-dasharray="10 8"/>
</svg>
